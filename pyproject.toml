[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncomatchmaker"
version = "0.1.0"
description = "Molecular profile to evidence and trial discovery POC"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1", "pymupdf>=1.24,<2", "pdfplumber>=0.11,<1", "python-dotenv>=1,<2", "streamlit>=1.40,<2", "eval-type-backport>=0.2; python_version < '3.10'"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*", "schemas*", "trials*", "evidence*", "ui*", "ingestion*", "normalization*"]

[tool.setuptools.package-data]
evidence = ["*.json"]
normalization = ["resources/*.json", "resources/*.gz"]
ingestion = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in network smoke tests"]

[tool.ruff]
target-version = "py39"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
